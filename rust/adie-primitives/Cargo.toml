[package]
name = "adie-primitives"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ADIE vOmega - Rust primitives (SHA-256, H_A, JCS, ClaimRoot, ACL, RSA verify, ML-DSA-65, hybrid verifier, ADIE deterministic CBOR)."

[lib]
name = "adie_primitives"
path = "src/lib.rs"

[[bin]]
name = "adie-h-a"
path = "src/main.rs"

[[bin]]
name = "adie-claimroot"
path = "src/bin/adie-claimroot.rs"

[[bin]]
name = "adie-acl"
path = "src/bin/adie-acl.rs"

[[bin]]
name = "adie-verify"
path = "src/bin/adie-verify.rs"

[[bin]]
name = "adie-mldsa"
path = "src/bin/adie-mldsa.rs"


[[bin]]
name = "adie-hybrid-verify"
path = "src/bin/adie-hybrid-verify.rs"

[dependencies]
serde_json = "1.0"
ml-dsa = "=0.1.1"
rsa = { version = "=0.9.6", features = ["sha2"] }
sha2 = "0.10"
ciborium = "=0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
