[package]
name = "adie-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ADIE vOmega — WASM delivery wrapper for adie-primitives (Phase 3, Gate 1, 3A.4B)."

[lib]
name = "adie_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
adie-primitives = { path = "../adie-primitives" }
wasm-bindgen = "0.2"
serde_json = "1.0"

# DEFECT-031: getrandom wasm32 backend requires explicit opt-in per
# version line. Cargo merges features graph-wide, so declaring here
# is sufficient. rust/adie-primitives remains unchanged.
#   0.2.x -> feature "js"
#   0.4.x -> feature "wasm_js" + rustc cfg getrandom_backend="wasm_js"
#            (the cfg lives in .cargo/config.toml under this crate)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
