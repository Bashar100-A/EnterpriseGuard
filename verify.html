<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Verify ADIE Report</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:3rem auto;padding:0 1rem;color:#1a1a2e;line-height:1.6}
h1{color:#0f3460;border-bottom:3px solid #0f3460;padding-bottom:.5rem}
.box{padding:1rem;border-radius:8px;margin:1rem 0;font-family:monospace;font-size:.85rem;word-break:break-all}
.ok{background:#e8f5e9;border-left:4px solid #2e7d32}
.err{background:#ffebee;border-left:4px solid #c62828}
.info{background:#e3f2fd;border-left:4px solid #1976d2}
textarea{width:100%;padding:.6rem;border:1px solid #ccc;border-radius:4px;font-family:monospace;font-size:.85rem;box-sizing:border-box;margin-bottom:1rem}
button{background:#0f3460;color:#fff;border:0;padding:.7rem 1.4rem;border-radius:4px;cursor:pointer;font-size:1rem}
button:hover{background:#16213e}
label{font-weight:600;display:block;margin:.5rem 0 .3rem}
</style></head><body>
<h1>Verify ADIE Report</h1>
<p>Paste the report JSON and public key PEM below, then click Verify.</p>

<label>Report JSON</label>
<textarea id="report" rows="6"></textarea>

<label>Public Key (PEM)</label>
<textarea id="pubkey" rows="5"></textarea>

<button onclick="verify()">Verify</button>
<div id="result"></div>

<script>
async function verify() {
  const out = document.getElementById('result');
  out.innerHTML = '<div class="box info">Verifying...</div>';
  try {
    const report = JSON.parse(document.getElementById('report').value);
    const pem = document.getElementById('pubkey').value;

    const pemBody = pem.replace(/-----[^-]+-----/g,'').replace(/\s+/g,'');
    const der = Uint8Array.from(atob(pemBody), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey(
      'spki', der, { name:'Ed25519' }, false, ['verify']
    );

    const sig = Uint8Array.from(
      report.signature.match(/.{1,2}/g).map(b => parseInt(b,16))
    );
    const msg = new TextEncoder().encode(report.report_hash);
    const ok = await crypto.subtle.verify('Ed25519', key, sig, msg);

    out.innerHTML = ok
      ? '<div class="box ok">[OK] Ed25519 signature VALID<br>Tests: '+report.passed+'/'+report.total+'<br>Hash: '+report.report_hash+'</div>'
      : '<div class="box err">[FAIL] Signature INVALID</div>';
  } catch(e) {
    out.innerHTML = '<div class="box err">Error: '+e.message+'</div>';
  }
}
</script>
</body></html>
