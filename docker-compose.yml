services:
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be provided by the deployment environment}"
      SALT: "${SALT:?SALT must be provided by the deployment environment}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be provided by the deployment environment}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: "clickhouse://clickhouse:clickhouse@clickhouse:9000/langfuse?dial_timeout=10s"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:clickhouse@clickhouse:9000/langfuse?dial_timeout=10s"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:?CLICKHOUSE_USER must be provided by the deployment environment}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be provided by the deployment environment}"
      CLICKHOUSE_DB: "langfuse"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
    depends_on:
      - db
      - clickhouse

  db:
    image: postgres:15-alpine
    container_name: langfuse-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be provided by the deployment environment}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided by the deployment environment}"
      POSTGRES_DB: postgres
    volumes:
      - langfuse-db:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: langfuse-clickhouse
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:?CLICKHOUSE_USER must be provided by the deployment environment}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be provided by the deployment environment}"
      CLICKHOUSE_DB: langfuse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse

  aaac-server:
    build: .
    container_name: aaac-server
    ports:
      - "8443:8443"
    secrets:
      - aaac_tls_cert
      - aaac_tls_key
    volumes:
      - ./tools/hardware_identity.json:/app/tools/hardware_identity.json:ro
      - ./tools/innocence_chain.json:/app/tools/innocence_chain.json
      - ./tools/ring_storage.jsonl:/app/tools/ring_storage.jsonl
      - ~/.enterpriseguard:/root/.enterpriseguard:ro
    restart: unless-stopped

volumes:
  langfuse-db:
  langfuse-clickhouse:

secrets:
  aaac_tls_cert:
    file: "${AAAC_TLS_CERT_FILE:?AAAC_TLS_CERT_FILE must point to an operator-provided certificate}"
  aaac_tls_key:
    file: "${AAAC_TLS_KEY_FILE:?AAAC_TLS_KEY_FILE must point to an operator-provided private key}"
