[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = src .

addopts = 
    --ignore=tests/test_aaac_cli.py
    --ignore=tests/test_alerts_monitor.py
    --ignore=tests/test_compliance_advanced.py
    --ignore=tests/vomega/b-plus/test_bplus_e2e.py
    --ignore=tests/vomega/b-plus/test_bplus_negative.py
    --ignore=tests/vomega/b-plus/test_bplus_sizes.py
    --cov=src/enterpriseguard/sdk/client.py
    --cov=src/enterpriseguard/sdk/key_lifecycle.py
    --cov=src/enterpriseguard/signing/backend.py
    --cov=src/enterpriseguard/decision/contracts.py
    --cov=src/enterpriseguard/response/contracts.py
    --cov-report=term-missing
    --cov-report=html:htmlcov
