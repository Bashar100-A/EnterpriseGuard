name: ADIE Adversarial Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Generate ephemeral keys (CI only)
        run: python generate_keys.py

      - name: Run 148 adversarial tests with signing
        run: python adie_validator.py --seed 42 --sign-key keys/adie_private.pem

      - name: Verify report as independent third party
        run: python verify_report.py adie_validation_report.json keys/adie_public.pem

      - name: Upload signed report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adie-signed-report
          path: |
            adie_validation_report.json
            adie_validation_report.html
