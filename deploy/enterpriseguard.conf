[enterpriseguard]
# ============================================================
# EnterpriseGuard Default Configuration Template
# ============================================================
# This file contains default paths and settings.
# During installation, the installer will generate a new
# enterpriseguard.conf with the actual install_root path.
# Manual edits to this file are allowed only for reference;
# the active config is the one generated by the installer.
# ============================================================

# Installation root (absolute path, adjust only in generated file)
install_root = /opt/enterpriseguard

# Tools directory
tools_dir = /opt/enterpriseguard/tools

# Protected directories (do not modify or read)
# ------------------------------------------------------------
# IMPORTANT: This list is for DOCUMENTATION ONLY.
# The actual protection is enforced by the hard-coded
# PROTECTED_DIRS set inside tools/installer.py.
# Editing this list here WILL NOT change the protection behavior.
# ------------------------------------------------------------
protected_dirs = adie,intelligence,src/enterpriseguard/adie,src/enterpriseguard/intelligence

# Governance files
activity_log = /opt/enterpriseguard/tools/activity_log.json
errors_log = /opt/enterpriseguard/tools/errors.log
decisions_log = /opt/enterpriseguard/tools/DECISIONS_LOG.md

# Integrity baseline paths
integrity_baseline = /opt/enterpriseguard/tools/integrity_baseline.json
integrity_sentinel = /opt/enterpriseguard/integrity_baseline_sentinel.json

# Trusted baseline paths
trusted_baseline = /opt/enterpriseguard/tools/TRUSTED_BASELINE.json
trusted_sentinel = /opt/enterpriseguard/TRUSTED_BASELINE_SENTINEL.json

# Periodic checklist interval in minutes (single source of truth)
checklist_interval_minutes = 60

# Time zone (currently UTC only)
timezone = UTC