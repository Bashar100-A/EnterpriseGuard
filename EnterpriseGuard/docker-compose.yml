services:
  enterprise-guard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_guard_app
    ports:
      - "8000:8000"
    volumes:
      - ./sibb_vault:/app/sibb_vault
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
